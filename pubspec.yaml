name: masic_generation
description: "Flutter task"

publish_to: 'none'


version: 1.0.0+2

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.5
  flutter_svg: ^2.0.16
  http: ^1.3.0
  lottie: ^3.2.0
  pinput: ^5.0.1
  mime_type: ^1.0.1
  logger: ^2.5.0
  intl: ^0.20.2
  image_picker: ^1.2.1
  flutter_widget_from_html: ^0.17.1
  dots_indicator: ^4.0.1
  carousel_slider: ^5.1.2
  translator: ^1.0.4+1
  graphview: ^1.5.1
  fl_chart:
  fluttertoast: ^9.0.0
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  firebase_core: ^4.11.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.7.0
  flutter_launcher_icons: ^0.13.1


flutter_gen:
  output: lib/core/utils/assets_path/
  line_length: 80
  integrations:
    flutter_svg: true
    lottie: true

# fvm dart pub global activate flutter_gen
# fvm dart run build_runner build

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true



  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins.ttf



